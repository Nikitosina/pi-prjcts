name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      # Typecheck plus deterministic fake-model checks, including quota reset/replay/race recovery.
      # Each script has a 240s budget. Browser, simulator and credentialed scripts stay out of CI.
      - run: npm run verify
