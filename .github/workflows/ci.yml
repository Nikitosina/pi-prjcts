name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      # Typecheck plus the deterministic fake-model checks. Browser, simulator and credentialed scripts stay out of CI.
      - run: npm run verify
