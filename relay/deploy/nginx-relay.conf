# In nginx's http {} context. Replace relay.example.com and the certificate paths.
limit_req_zone $binary_remote_addr zone=pi_relay_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pi_relay_connects:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=pi_relay_connections:10m;

server {
    listen 443 ssl;
    server_name relay.example.com;
    ssl_certificate /REPLACE/fullchain.pem;
    ssl_certificate_key /REPLACE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Pair codes are URL fragments, not requests. Avoid query strings and client IDs in logs too.
    access_log off;
    error_log /var/log/nginx/pi-relay-error.log crit;
    client_max_body_size 1k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    limit_conn pi_relay_connections 80;
    limit_conn_status 429;
    limit_req_status 429;

    location = /ws {
        limit_req zone=pi_relay_connects burst=10 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Overwrite untrusted forwarding headers; relay reads only this last, trusted hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
    }

    location / {
        limit_req zone=pi_relay_requests burst=30 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
